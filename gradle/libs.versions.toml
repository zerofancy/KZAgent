# Gradle Version Catalog for KZAgent
# https://docs.gradle.org/current/userguide/version_catalogs.html

[versions]
kotlin = "2.4.0"
compose = "1.11.1"
compose-multiplatform = "1.11.1"
compose-fluent = "v0.1.0"
material3 = "1.9.0"
markdown-renderer = "0.43.0"
coil3 = "3.5.0"
filekit = "0.14.2"
jna = "5.19.1"
okhttp = "4.12.0"
jsoup = "1.22.2"
kotlinx-coroutines = "1.11.0"
kotlinx-serialization = "1.9.0"
jvm-target = "17"

[libraries]
# Compose Desktop
compose-desktop-currentOs = { module = "org.jetbrains.compose.desktop:desktop", version.ref = "compose-multiplatform" }

# Material 3 (for markdown renderer and legacy controls)
material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "material3" }

# Compose Fluent UI
compose-fluent = { module = "io.github.compose-fluent:fluent", version.ref = "compose-fluent" }

# Markdown renderer
markdown-renderer-m3 = { module = "com.mikepenz:multiplatform-markdown-renderer-m3", version.ref = "markdown-renderer" }
markdown-renderer-code = { module = "com.mikepenz:multiplatform-markdown-renderer-code", version.ref = "markdown-renderer" }
markdown-renderer-coil3 = { module = "com.mikepenz:multiplatform-markdown-renderer-coil3", version.ref = "markdown-renderer" }

# Coil 3 (image loading)
coil3-network-okhttp = { module = "io.coil-kt.coil3:coil-network-okhttp", version.ref = "coil3" }
coil3-svg = { module = "io.coil-kt.coil3:coil-svg", version.ref = "coil3" }

# File dialogs
filekit-dialogs = { module = "io.github.vinceglb:filekit-dialogs", version.ref = "filekit" }

# JNA (Java Native Access)
jna = { module = "net.java.dev.jna:jna", version.ref = "jna" }
jna-platform = { module = "net.java.dev.jna:jna-platform", version.ref = "jna" }

# OkHttp
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-mockwebserver = { module = "com.squareup.okhttp3:mockwebserver", version.ref = "okhttp" }

# Jsoup (HTML parser)
jsoup = { module = "org.jsoup:jsoup", version.ref = "jsoup" }

# KotlinX Coroutines
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-swing = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "kotlinx-coroutines" }

# KotlinX Serialization
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }

[bundles]
# Markdown renderer bundle (all components)
markdown-renderer = ["markdown-renderer-m3", "markdown-renderer-code", "markdown-renderer-coil3"]

# Coil 3 bundle (all components)
coil3 = ["coil3-network-okhttp", "coil3-svg"]

# JNA bundle (core + platform)
jna = ["jna", "jna-platform"]

# KotlinX Coroutines bundle (core + swing dispatcher)
coroutines = ["kotlinx-coroutines-core", "kotlinx-coroutines-swing"]

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "compose-multiplatform" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
